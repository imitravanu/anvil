name: Live Eval Lane (weekly agent-quality signal)

# Phase 17's CI gate runs --mock, which is green by construction (the mock
# provider copies assertions/expected/ and cannot fail). This lane runs the
# REAL harness against a live provider so regressions in prompts, tools, the
# goal engine, and compaction are actually measured. Informational: scheduled,
# never PR-blocking.
#
# Arming: set the ANVIL_EVAL_LIVE_ENABLED repository secret to 'true' and
# provide ANVIL_PROVIDER (+ its key, e.g. GEMINI_API_KEY) as secrets.
# Without the opt-in the job skips quietly (no red builds for forks).

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider id for the live run"
        required: false
        default: ""
      model:
        description: "Model id for the live run"
        required: false
        default: ""

jobs:
  live-eval:
    name: Full eval + live certification matrix
    runs-on: ubuntu-latest
    if: ${{ secrets.ANVIL_EVAL_LIVE_ENABLED == 'true' }}
    env:
      ANVIL_PROVIDER: ${{ secrets.ANVIL_PROVIDER }}
      ANVIL_MODEL: ${{ secrets.ANVIL_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo
        run: npm run build

      - name: Full live eval (non-mock, all 15 tasks)
        # provider/model resolve from ANVIL_PROVIDER/ANVIL_MODEL env when
        # dispatch inputs are empty.
        run: |
          FLAGS=""
          if [ -n "${{ inputs.provider }}" ]; then FLAGS="$FLAGS --provider ${{ inputs.provider }}"; fi
          if [ -n "${{ inputs.model }}" ]; then FLAGS="$FLAGS --model ${{ inputs.model }}"; fi
          npm run eval -- $FLAGS

      - name: Live certification matrix (configured providers)
        run: npm run certify -- --all --out ./cert-matrix.json
        continue-on-error: true

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-reports
          path: ~/.anvil/evals/

      - name: Upload certification matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cert-matrix
          path: cert-matrix.json

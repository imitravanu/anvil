name: CI — Typecheck & Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typecheck-test:
    name: Typecheck + Unit Tests (core / tui / cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all refs so the gate's merge-base diff works
          # (origin/<base>...HEAD on PRs, HEAD~1 on push) and Step 1 actually
          # sees committed deltas in CI.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build first: tui/cli typecheck (tsc) resolves @anvil/core from its built
      # dist/ (package.json "files": ["dist"], "main"/"types" → dist). Building
      # core before running downstream typecheck/test keeps every workspace on
      # the freshly compiled API surface, matching the local monorepo flow.
      - name: Build monorepo
        run: npm run build

      - name: Typecheck all packages (strict)
        run: npm run typecheck

      - name: Run unit test suite (workspaces)
        run: npm test

      - name: Run fast agent evaluation suite
        run: npm run eval -- --fast --mock

      - name: Run provider certification suite (mock verification)
        run: npm run certify -- --mock --all

      # Authoritative final gate: integrity manifest (Step 0.5), slop scanner
      # (Step 1), build, typecheck, tests (includes the gate sentinel test),
      # and eval mocks. The sentinel test (packages/cli/src/__tests__/
      # gate.sentinel.test.ts) independently asserts the gate is intact.
      - name: Run Guardian Gate (integrity + anti-slop + quality)
        run: npm run gate
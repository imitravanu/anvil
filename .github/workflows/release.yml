name: Release & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run full unit test suite
        run: npm test

      - name: Run evaluation benchmark gate
        run: npm run eval -- --fast --mock

      - name: Run provider certification gate
        run: npm run certify -- --mock --all

      # AUDIT-04: the release path is the ONLY one that publishes, yet it ran
      # build/typecheck/test/eval without the gate — so the integrity manifest
      # (Step 0.5) and the slop/residual scans (Steps 1/1.5) were absent from
      # the one path that ships. Run the full gate before any publish.
      - name: Run Guardian Gate (integrity + anti-slop + quality)
        run: npm run gate

      - name: Validate release version and install packed CLI
        run: node scripts/verify-package.mjs --tag "$GITHUB_REF_NAME" --pack-destination dist-tarballs

      - name: Publish @anvil/core
        run: npm publish dist-tarballs/anvil-core-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @anvil/tui
        run: npm publish dist-tarballs/anvil-tui-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @anvil/cli
        run: npm publish dist-tarballs/anvil-cli-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate SHA256 checksums
        working-directory: dist-tarballs
        run: sha256sum *.tgz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-tarballs/*.tgz \
            dist-tarballs/SHA256SUMS \
            --title "Anvil $GITHUB_REF_NAME" \
            --generate-notes
